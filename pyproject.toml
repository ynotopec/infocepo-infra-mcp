[project]
name = "infocepo-infra-mcp"
version = "0.1.0"
description = "MCP server for infocepo.com infrastructure services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "boto3>=1.35.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
infocepo-mcp = "infocepo_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
