---
# Service ClusterIP interne qui pointe vers l'EndpointSlice externe
# (l'EndpointSlice externe pointe vers 192.168.1.149:8085)
apiVersion: v1
kind: Service
metadata:
  name: infocepo-mcp-ext
  namespace: demo1
  labels:
    app: infocepo-mcp
    endpointslice.kubernetes.io/managed-by: staff
spec:
  selector:
    endpointslice.kubernetes.io/managed-by: staff
    kubernetes.io/service-name: infocepo-mcp-ext
  ports:
    - port: 9100
      targetPort: 9100
      name: http
      protocol: TCP
  type: ClusterIP
  sessionAffinity: None
