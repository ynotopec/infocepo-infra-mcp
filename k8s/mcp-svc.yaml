# Service avec adresse IP externe vers le MCP hébergé sur le host (systemd)
# Utilisé par le Ingress pour rediriger mcp.ailab.infocepo.com vers 192.168.1.149:8085
apiVersion: v1
kind: Service
metadata:
  name: infocepo-mcp-external
  namespace: demo1
  labels:
    app: infocepo-mcp
    managed-by: external
spec:
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      protocol: TCP
  type: ClusterIP
  externalIPs:
    - "192.168.1.149"
